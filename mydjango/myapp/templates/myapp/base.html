{% load static %}
<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>{% block title %}Diploma{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-stars"></i> Diploma 2026</a>
      <div>
        <a href="/" class="btn btn-sm btn-outline-light me-2">Home</a>
        <a href="/publications/" class="btn btn-sm btn-outline-light me-2"><i class="bi bi-journals"></i> Публикации</a>
        {% if user.is_authenticated %}
        <a href="/publications/add/" class="btn btn-sm btn-light">+ Добавить</a>
        <span class="text-white ms-2">{{ user.username }}</span>
        {% else %}
        <a href="/login/" class="btn btn-sm btn-light me-2">Вход</a>
        <a href="/register/" class="btn btn-sm btn-outline-light">Регистрация</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <footer>
    <div class="container">
      2026 Diploma Project | Student + Post + Comment | <i class="bi bi-heart-fill"></i> Django - темно-фиолетовый
    </div>
  </footer>
</body>

</html>
